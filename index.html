<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PEMCIB SLOT: catálogo de coches y materiales en construcción.">
    <title>PEMCIB SLOT</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #101318;
        color: #f4f6f8;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      main {
        width: 100%;
        max-width: 640px;
        padding: clamp(24px, 6vw, 56px);
        border: 1px solid #303843;
        border-top: 3px solid #70d4b1;
        border-radius: 12px;
        background: #191e26;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(2rem, 7vw, 3.5rem);
        line-height: 1.15;
        letter-spacing: 0.04em;
      }

      p {
        margin: 0;
        color: #bfc8d3;
        font-size: clamp(1rem, 3vw, 1.2rem);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PEMCIB SLOT</h1>
      <p>Catálogo de coches y materiales en construcción.</p>
    </main>
  </body>
</html>
